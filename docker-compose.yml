version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: yangming-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-YangMing2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yangming}
      MYSQL_USER: ${MYSQL_USER:-yangming}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-YangMing2026!}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3306:3306'
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yangming-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-YangMing2026!}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: yangming-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: mysql://${MYSQL_USER:-yangming}:${MYSQL_PASSWORD:-YangMing2026!}@mysql:3306/${MYSQL_DATABASE:-yangming}
      REDIS_URL: redis://:${REDIS_PASSWORD:-YangMing2026!}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
    ports:
      - '3001:3001'
    volumes:
      - ./server/uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: yangming-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '80:80'

volumes:
  mysql_data:
  redis_data:
