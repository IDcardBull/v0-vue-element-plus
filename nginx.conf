server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # 静态文件 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/rss+xml font/truetype application/font-woff application/font-woff2;
    gzip_min_length 1024;

    root   /usr/share/nginx/html;
    index  index.html;

    # Vue Hash 模式路由下，所有前端路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 NestJS 后端容器
    location /api/ {
        proxy_pass         http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 20m;
    }

    # 静态资源长期缓存
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
